<title>说吧 พูดจีนได้</title>
<style>
:root{
  --bg:#faf7f4; --surface:#ffffff; --surface2:#f2ede8; --line:#e2d9d1;
  --ink:#241c18; --ink2:#6b5d54; --ink3:#9a8a80;
  --red:#8c1b1b; --red-soft:#b23a3a; --gold:#c8912b;
  --ok:#1e7a4d; --warn:#a8620d; --bad:#a32020;
  --r:16px; --shadow:0 1px 3px rgba(60,40,30,.10),0 8px 24px rgba(60,40,30,.06);
  --zh:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  --hero-grad:linear-gradient(160deg,#8c1b1b 0%,#5e1010 100%);
  color-scheme:light;
  --th:"Sarabun","Noto Sans Thai","Leelawadee UI",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17120f; --surface:#221b17; --surface2:#2c231e; --line:#3a2e27;
    --ink:#f3ece7; --ink2:#c0b0a6; --ink3:#8d7c72;
    --red:#c94b4b; --red-soft:#e07070; --gold:#e2b25a;
    --ok:#4bbd84; --warn:#e0a253; --bad:#e56a6a;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    --hero-grad:linear-gradient(160deg,#7d2020 0%,#3a0d0d 100%);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#17120f; --surface:#221b17; --surface2:#2c231e; --line:#3a2e27;
    --ink:#f3ece7; --ink2:#c0b0a6; --ink3:#8d7c72;
    --red:#c94b4b; --red-soft:#e07070; --gold:#e2b25a;
    --ok:#4bbd84; --warn:#e0a253; --bad:#e56a6a;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    --hero-grad:linear-gradient(160deg,#7d2020 0%,#3a0d0d 100%);
    color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--th);
  font-size:16px;line-height:1.5;overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:560px;margin:0 auto;min-height:100%;position:relative}
.screen{display:none;padding-bottom:88px;min-height:100%}
.screen.active{display:block}
.pad{padding:0 16px}
.foot-space{height:32px}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- hero ---------- */
.hero{
  background:var(--hero-grad);
  color:#fff;padding:20px 16px 22px;
  border-radius:0 0 26px 26px;box-shadow:var(--shadow);
}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:baseline;gap:9px}
.brand-zh{font-family:var(--zh);font-size:26px;font-weight:700;letter-spacing:2px}
.brand-th{font-size:14px;opacity:.85}
.streak{background:rgba(255,255,255,.16);border-radius:999px;padding:5px 13px;display:flex;align-items:baseline;gap:5px}
.streak b{font-size:19px}
.streak span{font-size:11px;opacity:.85}
.hero-plan{display:flex;gap:10px;margin-bottom:16px}
.hero-plan .pill{flex:1;background:rgba(255,255,255,.13);border-radius:14px;padding:11px 12px}
.hero-plan .pill b{display:block;font-size:24px;line-height:1.15}
.hero-plan .pill span{font-size:12px;opacity:.85}
.hero-note{margin-top:12px;font-size:12.5px;background:rgba(0,0,0,.22);padding:10px 12px;border-radius:12px;line-height:1.45}
.btn-primary{
  width:100%;background:#fff;color:var(--red);font-weight:700;
  border-radius:14px;padding:15px;font-size:17px;
}
.btn-primary:active{transform:scale(.985)}
.btn-primary.big{font-size:18px;padding:17px}
.btn-primary[disabled]{opacity:.55}

/* ---------- quick tiles ---------- */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 4px}
.quick-item{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;text-align:left;box-shadow:var(--shadow);
}
.quick-item span{font-size:22px;display:block;margin-bottom:5px}
.quick-item b{display:block;font-size:15px}
.quick-item i{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);margin-top:2px}

.sec-title{font-size:13px;text-transform:none;color:var(--ink3);margin:24px 0 10px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}

.bar{height:9px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);padding:3px 0}
.kv b{color:var(--ink)}

/* ---------- unit rows ---------- */
.unit{
  display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;width:100%;text-align:left;
}
.unit .u-ico{
  width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-family:var(--zh);font-size:17px;color:var(--red);font-weight:600;
}
.unit .u-mid{flex:1;min-width:0}
.unit .u-mid b{display:block;font-size:15px;font-weight:600}
.unit .u-mid span{font-size:12px;color:var(--ink3)}
.unit .u-bar{height:5px;background:var(--surface2);border-radius:99px;margin-top:6px;overflow:hidden}
.unit .u-bar>i{display:block;height:100%;background:var(--ok)}
.deck-head{font-size:15px;font-weight:700;margin:18px 0 4px;display:flex;align-items:center;gap:8px}
.deck-head small{font-weight:400;color:var(--ink3);font-size:12px}

/* ---------- topbar ---------- */
.topbar{
  top:env(safe-area-inset-top,0px);
  display:flex;align-items:center;gap:12px;padding:10px 14px;
  position:sticky;background:var(--bg);z-index:5;
}
.icon-btn{font-size:22px;width:40px;height:40px;border-radius:12px;background:var(--surface2);line-height:1}
.topbar-title{flex:1;font-weight:700;font-size:16px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-right{min-width:52px;text-align:right;font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.prog{flex:1;height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prog-in{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .25s}

/* ---------- study stage ---------- */
.stage{padding:8px 16px 16px;min-height:52vh;display:flex;flex-direction:column}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 10px;border-radius:99px;background:var(--surface2);color:var(--ink2);align-self:flex-start}
.badge.new{background:rgba(200,145,43,.18);color:var(--warn)}
.badge.rev{background:rgba(30,122,77,.14);color:var(--ok)}

.qcard{
  background:var(--surface);border:1px solid var(--line);border-radius:22px;
  padding:26px 20px;margin-top:14px;box-shadow:var(--shadow);text-align:center;
}
.zh{font-family:var(--zh);font-weight:600;line-height:1.32;letter-spacing:1px}
.zh-xl{font-size:44px}
.zh-l{font-size:34px}
.zh-m{font-size:24px}
.py{font-size:16px;color:var(--red-soft);margin-top:10px;letter-spacing:.4px}
.thp{font-size:19px;margin-top:6px;color:var(--ink)}
.mean{font-size:17px;margin-top:14px;color:var(--ink)}
.mean-big{font-size:24px;font-weight:600;line-height:1.4}
.note{
  font-size:13px;color:var(--ink2);background:var(--surface2);
  border-radius:12px;padding:10px 12px;margin-top:14px;text-align:left;line-height:1.5;
}
.note::before{content:"💡 ";}
.hint{font-size:13px;color:var(--ink3);margin-top:16px}
.unit-tag{font-size:12px;color:var(--ink3);margin-top:2px}

.audio-row{display:flex;gap:9px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.abtn{background:var(--surface2);border-radius:12px;padding:10px 16px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.abtn.mic{background:var(--red);color:#fff}
.abtn.mic.listening{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

.result{border-radius:14px;padding:12px 14px;margin-top:14px;text-align:left;font-size:14px;line-height:1.5}
.result.good{background:rgba(30,122,77,.13);color:var(--ok)}
.result.mid{background:rgba(200,145,43,.15);color:var(--warn)}
.result.bad{background:rgba(163,32,32,.12);color:var(--bad)}
.result .heard{font-family:var(--zh);font-size:18px;display:block;margin-top:5px;color:var(--ink)}

/* ---------- actions ---------- */
.actions{padding:0 16px 20px;display:flex;gap:9px;flex-wrap:wrap}
.actions .btn{
  flex:1;min-width:92px;border-radius:14px;padding:15px 8px;font-size:15px;font-weight:600;
  background:var(--surface);border:1.5px solid var(--line);text-align:center;
}
.actions .btn.solid{background:var(--red);border-color:var(--red);color:#fff}
.actions .btn.g-again{border-color:var(--bad);color:var(--bad)}
.actions .btn.g-ok{border-color:var(--ok);color:var(--ok)}
.actions .btn.g-easy{border-color:var(--gold);color:var(--gold)}
.actions .btn small{display:block;font-weight:400;font-size:11px;opacity:.75;margin-top:2px}
.actions .btn:active{transform:scale(.98)}

/* ---------- choices (listen mode) ---------- */
.choices{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.choice{
  background:var(--surface);border:1.5px solid var(--line);border-radius:14px;
  padding:14px 15px;text-align:left;font-size:15.5px;
}
.choice.right{border-color:var(--ok);background:rgba(30,122,77,.1)}
.choice.wrong{border-color:var(--bad);background:rgba(163,32,32,.1)}

/* ---------- dialogues ---------- */
.dlg-item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px}
.dlg-item b{display:block;font-size:15px}
.dlg-item span{font-size:12px;color:var(--ink3)}
.line{display:flex;margin:10px 0;gap:9px}
.line.you{flex-direction:row-reverse}
.bub{max-width:82%;border-radius:16px;padding:11px 13px;background:var(--surface);border:1px solid var(--line)}
.line.you .bub{background:var(--red);border-color:var(--red);color:#fff}
.line.you .bub .py{color:rgba(255,255,255,.85)}
.line.you .bub .m{color:rgba(255,255,255,.9)}
.bub .z,.bub .py,.bub .tp,.bub .m{display:block}
.bub .z{font-family:var(--zh);font-size:20px;line-height:1.4}
.bub .py{font-size:13px;color:var(--red-soft);margin-top:3px}
.bub .tp{font-size:14px;margin-top:2px}
.bub .m{font-size:13px;color:var(--ink2);margin-top:4px}
.who{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:14px}
.line.dim{opacity:.32}
.line .say{font-size:12px;margin-top:8px;background:rgba(255,255,255,.2);border-radius:9px;padding:6px 10px;display:inline-block}

/* ---------- โหมดโฟกัส: ซ่อนแถบล่าง ตรึงปุ่มไว้ท้ายจอ ---------- */
body.focus .tabbar{display:none}
body.focus .screen.active{display:flex;flex-direction:column;padding-bottom:0;height:100%}
body.focus .stage,body.focus .pad{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
body.focus .actions{padding-bottom:16px;padding-top:10px;border-top:1px solid var(--line);background:var(--bg)}

/* ---------- browse ---------- */
.search-wrap{padding:0 16px 8px;position:sticky;top:0;background:var(--bg);z-index:4}
#q{width:100%;padding:13px 15px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;font-family:inherit}
.chips{display:flex;gap:7px;margin-top:9px;overflow-x:auto;padding-bottom:2px}
.chip{white-space:nowrap;border:1.5px solid var(--line);border-radius:99px;padding:6px 13px;font-size:13px;background:var(--surface)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.row{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row .rl{flex:1;min-width:0}
.row .rz{font-family:var(--zh);font-size:21px;font-weight:600}
.row .rp{font-size:12.5px;color:var(--red-soft)}
.row .rt{font-size:14px}
.row .rm{font-size:13.5px;color:var(--ink2);margin-top:2px}
.row .rn{font-size:12px;color:var(--ink3);margin-top:5px;line-height:1.45;border-top:1px dashed var(--line);padding-top:5px}
.row .rb{flex:0 0 42px;height:42px;border-radius:12px;background:var(--surface2);font-size:17px;display:flex;align-items:center;justify-content:center}
.empty{text-align:center;color:var(--ink3);padding:36px 12px;font-size:14px}

/* ---------- settings ---------- */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px}
.set-row .sl{flex:1;min-width:0}
.set-row b{display:block;font-size:15px;font-weight:600}
.set-row small{display:block;color:var(--ink3);font-size:12px;line-height:1.45;margin-top:2px}
select,input[type=number]{font-family:inherit;font-size:15px;padding:9px 11px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);max-width:180px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--surface2);position:relative;flex:0 0 50px;border:1.5px solid var(--line)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--ink3);transition:.16s}
.sw.on{background:var(--red);border-color:var(--red)}
.sw.on::after{left:24px;background:#fff}
.danger{color:var(--bad)}
.info-block{font-size:13.5px;color:var(--ink2);line-height:1.65;background:var(--surface2);border-radius:14px;padding:14px;margin-bottom:10px}
.info-block b{color:var(--ink)}

/* ---------- stats ---------- */
.hm{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:12px}
.hm i{aspect-ratio:1;border-radius:3px;background:var(--surface2);display:block}
.hm i.l1{background:rgba(140,27,27,.3)}
.hm i.l2{background:rgba(140,27,27,.55)}
.hm i.l3{background:rgba(140,27,27,.8)}
.hm i.l4{background:var(--red)}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);max-width:560px;margin:0 auto;
}
.tabbar button{flex:1;padding:8px 2px 9px;font-size:10.5px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button span{font-size:19px;line-height:1}
.tabbar button.on{color:var(--red)}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;
  background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:12px;font-size:14px;
  max-width:88%;text-align:center;box-shadow:var(--shadow);
}
.done-wrap{text-align:center;padding:40px 20px}
.done-wrap .big-emo{font-size:56px}
.done-wrap h2{margin:12px 0 6px;font-size:22px}
.done-wrap p{color:var(--ink2);font-size:15px;margin:0 0 20px}

#backup-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
#bk-text{width:100%;min-height:96px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  border:1.5px solid var(--line);border-radius:11px;padding:10px;background:var(--surface2);color:var(--ink)}
.bk-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.bk-row .chip{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">

  <!-- ================= หน้าแรก ================= -->
  <section class="screen active" id="s-home">
    <header class="hero">
      <div class="hero-top">
        <div class="brand"><span class="brand-zh">说吧</span><span class="brand-th">พูดจีนได้</span></div>
        <div class="streak" id="streak-box"><b id="streak-n">0</b><span>วันติด</span></div>
      </div>
      <div class="hero-plan" id="plan-box"></div>
      <button class="btn-primary big" id="btn-start">เริ่มบทเรียนวันนี้</button>
      <div class="hero-note" id="tts-warn" hidden></div>
    </header>

    <div class="pad">
      <div class="quick">
        <button class="quick-item" data-go="speakdrill"><span>🎤</span><b>ฝึกพูดรัว</b><i>ไทย → พูดจีน</i></button>
        <button class="quick-item" data-go="dialogues"><span>💬</span><b>บทสนทนา</b><i>เล่นเป็นตัวคุณเอง</i></button>
        <button class="quick-item" data-go="listen"><span>👂</span><b>ฟังจับใจความ</b><i>ฟังจีน เลือกความหมาย</i></button>
        <button class="quick-item" data-go="browse"><span>📚</span><b>คลังคำ</b><i>ค้นหาก่อนออกไปเจรจา</i></button>
      </div>

      <h3 class="sec-title">ความคืบหน้า</h3>
      <div class="card" id="progress-card"></div>

      <h3 class="sec-title">หมวดคำ</h3>
      <div id="unit-list"></div>
      <div class="foot-space"></div>
    </div>
  </section>

  <!-- ================= เรียน / ทวน ================= -->
  <section class="screen" id="s-study">
    <div class="topbar">
      <button class="icon-btn" data-back>✕</button>
      <div class="prog"><div class="prog-in" id="study-prog"></div></div>
      <div class="topbar-right" id="study-count">0/0</div>
    </div>
    <div class="stage" id="study-stage"></div>
    <div class="actions" id="study-actions"></div>
  </section>

  <!-- ================= ฝึกพูด ================= -->
  <section class="screen" id="s-speak">
    <div class="topbar">
      <button class="icon-btn" data-back>✕</button>
      <div class="prog"><div class="prog-in" id="speak-prog"></div></div>
      <div class="topbar-right" id="speak-count">0/0</div>
    </div>
    <div class="stage" id="speak-stage"></div>
    <div class="actions" id="speak-actions"></div>
  </section>

  <!-- ================= ฟัง ================= -->
  <section class="screen" id="s-listen">
    <div class="topbar">
      <button class="icon-btn" data-back>✕</button>
      <div class="prog"><div class="prog-in" id="listen-prog"></div></div>
      <div class="topbar-right" id="listen-count">0/0</div>
    </div>
    <div class="stage" id="listen-stage"></div>
    <div class="actions" id="listen-actions"></div>
  </section>

  <!-- ================= บทสนทนา ================= -->
  <section class="screen" id="s-dialogues">
    <div class="topbar"><button class="icon-btn" data-back>‹</button><div class="topbar-title">บทสนทนา</div><div class="topbar-right"></div></div>
    <div class="pad" id="dialogue-list"></div>
  </section>

  <section class="screen" id="s-dialogue">
    <div class="topbar"><button class="icon-btn" data-back>‹</button><div class="topbar-title" id="dlg-title"></div><div class="topbar-right"></div></div>
    <div class="pad" id="dlg-body"></div>
    <div class="actions" id="dlg-actions"></div>
  </section>

  <!-- ================= คลังคำ ================= -->
  <section class="screen" id="s-browse">
    <div class="topbar"><button class="icon-btn" data-back>‹</button><div class="topbar-title">คลังคำ</div><div class="topbar-right"></div></div>
    <div class="search-wrap">
      <input type="search" id="q" placeholder="ค้นหา ไทย / จีน / พินอิน เช่น กระเบื้อง, MOQ, jiage" autocomplete="off">
      <div class="chips" id="deck-chips"></div>
    </div>
    <div class="pad" id="browse-list"></div>
  </section>

  <!-- ================= สถิติ ================= -->
  <section class="screen" id="s-stats">
    <div class="topbar"><button class="icon-btn" data-back>‹</button><div class="topbar-title">สถิติ</div><div class="topbar-right"></div></div>
    <div class="pad" id="stats-body"></div>
  </section>

/* ระบบทวนอัตโนมัติ (SRS) — ตัดสินใจให้ว่าวันนี้ควรทวนคำไหน เก็บข้อมูลในเครื่อง */
(function () {
  const KEY = 'zhth.v1';
  const DAY = 86400000;

  const DEFAULTS = {
    v: 1,
    cards: {},
    stats: { streak: 0, best: 0, lastDay: null, days: {} },
    settings: {
      newPerDay: 12,
      sessionMin: 30,
      decks: ['core', 'daily', 'mat'],
      rate: 0.85,
      voiceURI: null,
      showThaiPhonetic: true,
      showPinyin: true,
      autoPlay: true,
      micEnabled: true
    }
  };

  let S = null;

  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      S = raw ? JSON.parse(raw) : null;
    } catch (e) { S = null; }
    if (!S || S.v !== 1) S = JSON.parse(JSON.stringify(DEFAULTS));
    // เติมค่าตั้งต้นที่อาจหายไปจากเวอร์ชันเก่า
    Object.keys(DEFAULTS.settings).forEach(function (k) {
      if (S.settings[k] === undefined) S.settings[k] = DEFAULTS.settings[k];
    });
    if (!S.stats.days) S.stats.days = {};
    return S;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }

  function card(id) {
    if (!S.cards[id]) S.cards[id] = { ivl: 0, ease: 2.5, due: 0, reps: 0, lapses: 0, last: 0, spoken: 0 };
    return S.cards[id];
  }

  function isNew(id) { return !S.cards[id] || S.cards[id].reps === 0; }

  /* grade: 0 = ลืม, 1 = จำได้, 2 = ง่าย */
  function grade(id, g) {
    const c = card(id);
    const now = Date.now();
    if (g === 0) {
      c.lapses++;
      c.ease = Math.max(1.3, c.ease - 0.2);
      c.ivl = 0;
      c.due = now + 8 * 60000;           // กลับมาใน 8 นาที (ในรอบเดียวกัน)
    } else if (g === 1) {
      if (c.reps === 0) c.ivl = 1;
      else if (c.ivl <= 1) c.ivl = 3;
      else c.ivl = Math.round(c.ivl * c.ease);
      c.due = now + c.ivl * DAY;
    } else {
      c.ease = Math.min(2.8, c.ease + 0.1);
      c.ivl = c.reps === 0 ? 4 : Math.max(4, Math.round(c.ivl * c.ease * 1.3));
      c.due = now + c.ivl * DAY;
    }
    c.reps++;
    c.last = now;
    bump(g === 0 ? 'again' : 'ok');
    save();
    return c;
  }

  function markSpoken(id, ok) {
    const c = card(id);
    if (ok) c.spoken++;
    bump('spoke');
    save();
  }

  function bump(kind) {
    const d = today();
    if (!S.stats.days[d]) S.stats.days[d] = { rev: 0, again: 0, spoke: 0, newDone: 0, sec: 0 };
    const t = S.stats.days[d];
    if (kind === 'ok') t.rev++;
    else if (kind === 'again') { t.rev++; t.again++; }
    else if (kind === 'spoke') t.spoke++;
    else if (kind === 'new') t.newDone++;
  }

  function touchStreak() {
    const d = today();
    if (S.stats.lastDay === d) return;
    const y = new Date(Date.now() - DAY);
    const ys = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
    S.stats.streak = (S.stats.lastDay === ys) ? S.stats.streak + 1 : 1;
    S.stats.best = Math.max(S.stats.best || 0, S.stats.streak);
    S.stats.lastDay = d;
    save();
  }

  function pool() {
    const on = S.settings.decks;
    return window.DATA.all.filter(function (x) { return on.indexOf(x.deck) >= 0; });
  }

  function dueList() {
    const now = Date.now();
    return pool().filter(function (x) {
      const c = S.cards[x.i];
      return c && c.reps > 0 && c.due <= now;
    }).sort(function (a, b) { return S.cards[a.i].due - S.cards[b.i].due; });
  }

  function newList(limit) {
    const d = today();
    const doneToday = (S.stats.days[d] && S.stats.days[d].newDone) || 0;
    const room = Math.max(0, (limit === undefined ? S.settings.newPerDay : limit) - doneToday);
    if (!room) return [];
    // เรียงจากง่ายไปยาก แล้วเรียงตามลำดับในคลัง เพื่อให้เรียนเป็นหมวดต่อเนื่อง
    return pool().filter(function (x) { return isNew(x.i); })
      .sort(function (a, b) { return (a.l - b.l) || a.i.localeCompare(b.i); })
      .slice(0, room);
  }

  /* สร้างแผนของวันนี้: สลับคำใหม่แทรกกับคำทวน เพื่อไม่ให้ล้าสมอง */
  function buildSession() {
    const rev = dueList().slice(0, 90);
    const nw = newList();
    const out = [];
    let ri = 0, ni = 0;
    while (ri < rev.length || ni < nw.length) {
      for (let k = 0; k < 3 && ri < rev.length; k++) out.push({ item: rev[ri++], mode: 'review' });
      if (ni < nw.length) out.push({ item: nw[ni++], mode: 'new' });
    }
    return out;
  }

  function counts() {
    const p = pool();
    let learned = 0, mature = 0;
    p.forEach(function (x) {
      const c = S.cards[x.i];
      if (c && c.reps > 0) { learned++; if (c.ivl >= 21) mature++; }
    });
    return {
      total: p.length,
      learned: learned,
      mature: mature,
      due: dueList().length,
      newAvail: newList().length,
      todayNewDone: (S.stats.days[today()] && S.stats.days[today()].newDone) || 0
    };
  }

  function noteNewSeen() { bump('new'); save(); }

  function addSeconds(sec) {
    const d = today();
    if (!S.stats.days[d]) S.stats.days[d] = { rev: 0, again: 0, spoke: 0, newDone: 0, sec: 0 };
    S.stats.days[d].sec += sec;
    save();
  }

  function reset() { S = JSON.parse(JSON.stringify(DEFAULTS)); save(); }

  function exportJSON() { return JSON.stringify(S); }
  function importJSON(txt) {
    const o = JSON.parse(txt);
    if (!o || o.v !== 1) throw new Error('ไฟล์ไม่ถูกต้อง');
    S = o; load(); save();
  }

  window.SRS = {
    load: load, save: save, state: function () { return S; },
    settings: function () { return S.settings; },
    grade: grade, markSpoken: markSpoken, card: card, isNew: isNew,
    buildSession: buildSession, counts: counts, dueList: dueList,
    touchStreak: touchStreak, noteNewSeen: noteNewSeen, addSeconds: addSeconds,
    today: today, reset: reset, exportJSON: exportJSON, importJSON: importJSON
  };
})();

/* เสียงพูด (TTS) และการฟังเสียงคุณเพื่อให้คะแนน (ASR)
   ทั้งสองอย่างใช้ของที่มีอยู่ในเบราว์เซอร์ ไม่ต้องต่อ API ไม่มีค่าใช้จ่าย */
(function () {
  let voices = [];
  let chosen = null;

  function refresh() {
    try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { voices = []; }
    return voices;
  }

  function zhVoices() {
    return refresh().filter(function (v) {
      return /^zh/i.test(v.lang || '') || /chinese|中文|普通话|國語|国语/i.test(v.name || '');
    });
  }

  function pick(uri) {
    const list = zhVoices();
    if (!list.length) { chosen = null; return null; }
    if (uri) {
      const hit = list.filter(function (v) { return v.voiceURI === uri; })[0];
      if (hit) { chosen = hit; return hit; }
    }
    // ชอบ zh-CN (จีนกลางแผ่นดินใหญ่) มากกว่า zh-TW / zh-HK
    const cn = list.filter(function (v) { return /zh[-_]?CN|Hans/i.test(v.lang + ' ' + v.name); });
    chosen = cn[0] || list[0];
    return chosen;
  }

  function ttsReady() { return zhVoices().length > 0; }

  function speak(text, opt) {
    opt = opt || {};
    if (!('speechSynthesis' in window)) return false;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text).replace(/[（(].*?[)）]/g, ''));
      const v = chosen || pick(opt.voiceURI);
      if (v) u.voice = v;
      u.lang = (v && v.lang) || 'zh-CN';
      u.rate = opt.rate || 0.85;
      u.pitch = 1;
      if (opt.onend) u.onend = opt.onend;
      window.speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  }

  function stop() { try { window.speechSynthesis.cancel(); } catch (e) {} }

  /* ---------- การฟังเสียง (ASR) ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  function asrSupported() { return !!SR; }

  let rec = null;
  function listen(cb) {
    if (!SR) { cb({ ok: false, err: 'unsupported' }); return null; }
    try { if (rec) rec.abort(); } catch (e) {}
    rec = new SR();
    rec.lang = 'zh-CN';
    rec.interimResults = false;
    rec.maxAlternatives = 5;
    rec.continuous = false;
    let done = false;
    rec.onresult = function (ev) {
      done = true;
      const alts = [];
      const r = ev.results[0];
      for (let i = 0; i < r.length; i++) alts.push(r[i].transcript);
      cb({ ok: true, alts: alts, text: alts[0] || '' });
    };
    rec.onerror = function (ev) {
      if (done) return;
      done = true;
      cb({ ok: false, err: ev.error || 'error' });
    };
    rec.onend = function () { if (!done) { done = true; cb({ ok: false, err: 'no-speech' }); } };
    try { rec.start(); } catch (e) { cb({ ok: false, err: 'start-failed' }); }
    return rec;
  }

  function abort() { try { if (rec) rec.abort(); } catch (e) {} }

  /* ---------- ให้คะแนนการออกเสียง ---------- */
  function norm(s) {
    return String(s || '')
      .replace(/[\s　]/g, '')
      .replace(/[，。！？、,.!?；;：:"'“”‘’（）()【】\[\]]/g, '')
      .toLowerCase();
  }

  function lcs(a, b) {
    const n = a.length, m = b.length;
    if (!n || !m) return 0;
    let prev = new Array(m + 1).fill(0), cur = new Array(m + 1).fill(0);
    for (let i = 1; i <= n; i++) {
      for (let j = 1; j <= m; j++) {
        cur[j] = a[i - 1] === b[j - 1] ? prev[j - 1] + 1 : Math.max(prev[j], cur[j - 1]);
      }
      const t = prev; prev = cur; cur = t; cur.fill(0);
    }
    return prev[m];
  }

  /* คืนคะแนน 0–100 โดยเทียบกับตัวเลือกที่เครื่องได้ยินทั้งหมด แล้วเอาอันที่ดีที่สุด */
  function score(target, alts) {
    const t = norm(target);
    if (!t) return { score: 0, best: '' };
    let best = 0, bestText = '';
    (alts || []).forEach(function (a) {
      const h = norm(a);
      if (!h) return;
      const common = lcs(t, h);
      const s = Math.round((2 * common / (t.length + h.length)) * 100);
      if (s > best) { best = s; bestText = a; }
    });
    return { score: best, best: bestText };
  }

  function errMessage(code) {
    switch (code) {
      case 'not-allowed':
      case 'service-not-allowed':
        return 'เบราว์เซอร์ไม่อนุญาตให้ใช้ไมค์ — กดอนุญาตไมโครโฟนในการตั้งค่าเว็บไซต์';

      case 'network':

      case 'aborted':
        return 'ยกเลิกการฟัง';
      default:
        return 'ฟังไม่สำเร็จ ลองใหม่อีกครั้ง';
    }
  }

  window.SPEECH = {
    refresh: refresh, zhVoices: zhVoices, pick: pick, ttsReady: ttsReady,
    speak: speak, stop: stop,
    asrSupported: asrSupported, listen: listen, abort: abort,
    score: score, norm: norm, errMessage: errMessage,
    current: function () { return chosen; }
  };

  if ('speechSynthesis' in window) {
    refresh();
    window.speechSynthesis.onvoiceschanged = function () { refresh(); if (!chosen) pick(); };
  }
})();

/* ตรรกะหลักของแอป */
(function () {

    stack.pop();
    const t = stack[stack.length - 1] || 'home';
    render(t); show(t);
  }
  function pushFocus(name) {
    while (stack.length && FOCUS.indexOf(stack[stack.length - 1]) >= 0) stack.pop();
    stack.push(name); show(name);
  }

    if (name === 'home') renderHome();

    if (pool.length < 6) pool = D.all.filter(function (x) { return set.decks.indexOf(x.deck) >= 0 && x.l <= 2; });

    const sents = shuffle(pool.filter(function (x) { return x.k === 's'; }));
    const words = shuffle(pool.filter(function (x) { return x.k === 'w'; }));

  /* ================= ฟังจับใจความ ================= */
  let LS = null;
  function startListen() {

  function renderDialogueList() {

    el.innerHTML = '<div class="info-block">เล่นเป็น <b>ตัวคุณเอง</b> — ฟังอีกฝ่ายพูด แล้วพูดตอบกลับเป็นภาษาจีน นี่คือส่วนที่ใกล้ของจริงที่สุดในแอปนี้</div>' +

        return '<button class="dlg-item" data-d="' + d.id + '"><b>' + esc(d.title) + '</b>' +
          '<span>' + d.lines.length + ' บรรทัด · ระดับ ' + d.lvl + ' · ' + (d.deck === 'mat' ? 'ธุรกิจ' : 'ชีวิตประจำวัน') + '</span></button>';
      }).join('');
    $$('.dlg-item', el).forEach(function (b) {
      b.onclick = function () { openDialogue(b.dataset.d); };

  let DG = null;
  function openDialogue(id) {
    const d = D.dialogues.filter(function (x) { return x.id === id; })[0];
    if (!d) return;
    DG = { d: d, i: 0 };
    $('#dlg-title').textContent = d.title;
    pushFocus('dialogue');
    drawDialogue();
  }

  function drawDialogue() {
    const d = DG.d;
    $('#dlg-body').innerHTML = d.lines.map(function (L, k) {
      const mine = L.w === 'y';
      const hidden = k > DG.i;
      const masked = mine && k === DG.i;
      return '<div class="line ' + (mine ? 'you' : 'them') + (hidden ? ' dim' : '') + '" data-k="' + k + '">' +
        '<span class="who">' + (mine ? '🙋' : '🧑‍🏭') + '</span>' +
        '<span class="bub">' +
          (hidden ? '<span class="z">· · ·</span>' :
            (masked ? '<span class="m" style="color:inherit">' + esc(L.m) + '</span><span class="say">🎤 พูดประโยคนี้เป็นภาษาจีน</span>'
              : '<span class="z">' + esc(L.z) + '</span><span class="py">' + esc(L.p) + '</span>' +
                '<span class="tp">' + esc(L.t) + '</span><span class="m">' + esc(L.m) + '</span>')) +
        '</span></div>';
    }).join('') + '<div id="dlg-out"></div><div class="foot-space"></div>';

    const cur = d.lines[DG.i];
    const act = $('#dlg-actions');
    if (!cur) {
      act.innerHTML = '<button class="btn solid" id="dg-restart">เล่นอีกรอบ</button><button class="btn" data-back>กลับ</button>';
      $('#dg-restart').onclick = function () { DG.i = 0; drawDialogue(); };
      return;
    }
    if (cur.w === 'y') {
      act.innerHTML =
        (SP.asrSupported() && S.settings().micEnabled ? '<button class="btn solid" id="dg-mic">🎤 พูด</button>' : '') +
        '<button class="btn" id="dg-hint">คำใบ้</button>' +
        '<button class="btn" id="dg-skip">ข้าม</button>';
      const m = $('#dg-mic');
      if (m) m.onclick = function () {
        doMic({ i: 'dlg-' + d.id + '-' + DG.i, z: cur.z }, m, $('#dlg-out'), null);
      };
      $('#dg-hint').onclick = function () {
        $('#dlg-out').innerHTML = '<div class="result mid"><span class="heard">' + esc(cur.z) + '</span>' + esc(cur.p) + ' · ' + esc(cur.t) + '</div>';
        say(cur.z, true);
      };
      $('#dg-skip').onclick = function () { DG.i++; drawDialogue(); scrollBottom(); };
    } else {
      act.innerHTML = '<button class="btn" id="dg-replay">🔊 ฟังซ้ำ</button><button class="btn solid" id="dg-go">ต่อไป</button>';
      $('#dg-replay').onclick = function () { say(cur.z); };
      $('#dg-go').onclick = function () { DG.i++; drawDialogue(); scrollBottom(); };
      setTimeout(function () { say(cur.z); }, 260);
    }
    scrollBottom();
  }
  function scrollBottom() {
    setTimeout(function () {
      const box = $('#s-dialogue .pad');
      if (box) box.scrollTop = box.scrollHeight;
    }, 60);
  }

  /* ================= คลังคำ ================= */
  let bFilter = 'all';
  function renderBrowse() {
    const chips = $('#deck-chips');
    const list = [['all', 'ทั้งหมด'], ['core', 'ชุดแกน'], ['daily', 'ชีวิตประจำวัน'], ['mat', 'วัสดุ/ธุรกิจ'], ['s', 'เฉพาะประโยค'], ['star', 'ที่ยังไม่แม่น']];
    chips.innerHTML = list.map(function (c) {
      return '<button class="chip' + (bFilter === c[0] ? ' on' : '') + '" data-f="' + c[0] + '">' + esc(c[1]) + '</button>';
    }).join('');
    $$('.chip', chips).forEach(function (b) {
      b.onclick = function () { bFilter = b.dataset.f; renderBrowse(); };
    });
    drawBrowseList();
  }

  function drawBrowseList() {
    const q = ($('#q').value || '').trim().toLowerCase();
    let items = D.all.slice();
    if (bFilter === 'core' || bFilter === 'daily' || bFilter === 'mat') items = items.filter(function (x) { return x.deck === bFilter; });
    else if (bFilter === 's') items = items.filter(function (x) { return x.k === 's'; });
    else if (bFilter === 'star') items = items.filter(function (x) { const c = S.state().cards[x.i]; return c && c.lapses > 0 && c.ivl < 21; });
    if (q) {
      const nq = D.stripTones(q);
      items = items.filter(function (x) { return x._s.indexOf(nq) >= 0; });
    }
    const el = $('#browse-list');
    if (!items.length) { el.innerHTML = '<div class="empty">ไม่พบคำที่ค้นหา</div>'; return; }
    el.innerHTML = '<div class="empty" style="padding:6px 0 12px">' + items.length + ' รายการ</div>' +
      items.slice(0, 300).map(function (x) {
        return '<div class="row"><div class="rl">' +
          '<div class="rz">' + esc(x.z) + '</div>' +
          '<div class="rp">' + esc(x.p) + '</div>' +
          '<div class="rt">' + esc(x.t) + '</div>' +
          '<div class="rm">' + esc(x.m) + '</div>' +
          (x.n ? '<div class="rn">' + esc(x.n) + '</div>' : '') +
          '</div><button class="rb" data-say="' + esc(x.z) + '">🔊</button></div>';
      }).join('') + '<div class="foot-space"></div>';
    $$('[data-say]', el).forEach(function (b) { b.onclick = function () { say(b.dataset.say); }; });
  }
  $('#q').addEventListener('input', drawBrowseList);

  /* ================= สถิติ ================= */
  function renderStats() {
    const st = S.state(), c = S.counts();
    const days = [];
    for (let k = 27; k >= 0; k--) {
      const d = new Date(Date.now() - k * 86400000);
      const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      days.push(st.stats.days[key] || null);
    }
    const totRev = Object.keys(st.stats.days).reduce(function (a, k) { return a + (st.stats.days[k].rev || 0); }, 0);
    const totSec = Object.keys(st.stats.days).reduce(function (a, k) { return a + (st.stats.days[k].sec || 0); }, 0);
    const totSpoke = Object.keys(st.stats.days).reduce(function (a, k) { return a + (st.stats.days[k].spoke || 0); }, 0);
    const t = st.stats.days[S.today()] || { rev: 0, spoke: 0, sec: 0, newDone: 0 };

    $('#stats-body').innerHTML =
      '<div class="card"><div class="kv"><span>วันนี้</span><b>' + t.rev + ' คำ · ' + Math.round(t.sec / 60) + ' นาที</b></div>' +
      '<div class="kv"><span>คำใหม่วันนี้</span><b>' + t.newDone + '</b></div>' +
      '<div class="kv"><span>ฝึกพูดวันนี้</span><b>' + t.spoke + ' ครั้ง</b></div></div>' +
      '<h3 class="sec-title">28 วันที่ผ่านมา</h3>' +
      '<div class="card"><div class="hm">' + days.map(function (d) {
        const n = d ? d.rev : 0;
        const lv = n === 0 ? '' : n < 15 ? 'l1' : n < 40 ? 'l2' : n < 80 ? 'l3' : 'l4';
        return '<i class="' + lv + '" title="' + n + '"></i>';
      }).join('') + '</div></div>' +
      '<h3 class="sec-title">รวมทั้งหมด</h3>' +
      '<div class="card">' +
      '<div class="kv"><span>ทวนไปแล้ว</span><b>' + totRev + ' ครั้ง</b></div>' +
      '<div class="kv"><span>ฝึกพูด</span><b>' + totSpoke + ' ครั้ง</b></div>' +
      '<div class="kv"><span>เวลาเรียนสะสม</span><b>' + Math.round(totSec / 60) + ' นาที</b></div>' +
      '<div class="kv"><span>คำที่เรียนแล้ว</span><b>' + c.learned + ' / ' + c.total + '</b></div>' +
      '<div class="kv"><span>จำแน่นแล้ว</span><b>' + c.mature + '</b></div></div>' +
      '<div class="foot-space"></div>';
  }

        armed = true; this.textContent = 'กดอีกครั้งเพื่อยืนยัน';
        const b = this;
        armT = setTimeout(function () { armed = false; b.textContent = 'ล้าง'; }, 4000);
        return;
      }
      clearTimeout(armT); S.reset(); toast('ล้างความคืบหน้าแล้ว'); renderSettings();
    };
  }

  /* ================= utils ================= */
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  /* ================= boot ================= */
  SP.pick(S.settings().voiceURI);
  renderHome();
  setTimeout(function () { if (SP.zhVoices().length) { SP.pick(S.settings().voiceURI); renderHome(); } }, 900);

})();
</script>
